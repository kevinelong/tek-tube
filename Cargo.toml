[package]
name = "tek-tube"
version = "0.3.1"
edition = "2021"
description = "Tektronix 4010/4014 storage-tube vector display emulator with phosphor persistence"
license = "FSL-1.1-MIT"

[dependencies]
minifb = "0.28"
png = "0.18"
# ConPTY/pseudoconsole plumbing for terminal mode.  Hand-rolling this through
# raw FFI was tried first and failed in ways that cost hours (see
# docs/terminal-mode.md), so it is worth one dependency.
portable-pty = "0.9"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
